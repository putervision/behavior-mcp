<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Behavior Runtime MCP Visualizer</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f9fafb; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 320px; border-right: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    #main { flex: 1; padding: 2rem; overflow-y: auto; }
    .card { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.25rem; margin-top: 0; color: #10b981; }
    .node-active { padding: 0.5rem; background: rgba(16,185,129,0.15); border: 1px solid #10b981; border-radius: 4px; margin-bottom: 0.5rem; font-family: monospace; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>60Hz Runtime Monitor</h2>
    <div style="font-size: 0.9rem; color: #9ca3af;">Live In-Browser Behavior Tree Execution</div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); width: 100%;">
    <div>
      <strong>Status:</strong> <span style="color: #10b981;">RUNNING</span>
    </div>
    <div>
      <strong>Tick Rate:</strong> 60 Hz
    </div>
  </div>
  <div id="main">
    <div class="card">
      <h2>Active Tree Traversal Path</h2>
      <div class="node-active">root/combat_kite_selector/seq_emergency_heal/flee_to_safety</div>
    </div>
  </div>
</body>
</html>
